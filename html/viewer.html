<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Viewer</title>
    <link rel="stylesheet" href="../styles/viewer.css" />
  </head>
  <body>
    <!-- ── Toolbar ─────────────────────────────────────────── -->
    <div class="toolbar">
      <span class="toolbar-title">⚡ Flow Viewer</span>

      <div class="search-wrap">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input
          id="searchUrl"
          type="text"
          placeholder="Search by URL, payload, or response"
          autocomplete="off"
        />
      </div>

      <select id="filterMethod" title="Show only entries with this HTTP method">
        <option value="">All Methods</option>
      </select>

      <select id="filterStatus" title="Show only entries with this HTTP response status code">
        <option value="">All Statuses</option>
      </select>

      <button id="clearFilters" title="Reset search text, method filter, and status filter">✕ Clear</button>
      <span id="resultCount">0 / 0 requests</span>

      <label class="upload-label" for="fileInput">📂 Upload JSON</label>
      <input id="fileInput" type="file" accept=".json" />

      <div class="search-scope">
        <span class="search-scope-label">Search in:</span>
        <label class="scope-option" title="Search inside the frontend page URL (entry.page.url or entry.route)">
          <input type="checkbox" id="scopeFeUrl" checked />
          FE URL
        </label>
        <label class="scope-option" title="Search inside the API request URL (entry.request.url)">
          <input type="checkbox" id="scopeApiUrl" checked />
          API Endpoint
        </label>
        <label class="scope-option" title="Search inside the request body / POST data">
          <input type="checkbox" id="scopePayload" checked />
          Payload
        </label>
        <label class="scope-option" title="Search inside the API response body">
          <input type="checkbox" id="scopeResponse" checked />
          Response
        </label>
        <button id="downloadFiltered" class="download-filtered-btn" title="Download only the currently visible (filtered) entries as a JSON file">⬇ Download JSON</button>
      </div>
    </div>

    <!-- ── Entries ──────────────────────────────────────────── -->
    <div id="flowContainer">
      <div class="empty-state">
        No flow data loaded yet.<br />Upload a JSON file or trigger capture from
        the extension.
      </div>
    </div>

    <!-- ── Footer ────────────────────────────────────────────── -->
    <footer class="dev-footer">
      <span class="dev-name">Majid Ali</span>
      <span class="dev-role">Full Stack Web Developer</span>
      <div class="dev-links">
        <a href="https://majidev.netlify.app" target="_blank">majidev.netlify.app</a>
        <span class="dev-sep">·</span>
        <a href="https://github.com/Majid-Ali-Watto" target="_blank">github.com/Majid-Ali-Watto</a>
      </div>
    </footer>

    <script type="module" src="../js/viewer.js"></script>
  </body>
</html>
